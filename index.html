<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kasatria Assignment - Interactive 3D Periodic Table"
    />

    <title>Kasatria Assignment</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/visualization.css" />
  </head>

  <body>
    <section id="login-screen" class="login-screen">
      <div class="login-card">
        <h1 class="login-title">Login to Kasatria Assignment</h1>

        <p class="login-description">
          Sign in with your Google account to continue.
        </p>

        <div id="google-sign-in" class="google-sign-in"></div>
      </div>
    </section>

    <!-- Visualization Screen -->
    <section id="visualization-screen" class="visualization-screen hidden">
      <!-- Top Navigation -->
      <header class="navbar">
        <div class="navbar-brand">
          <h2>Kasatria Assignment</h2>
        </div>

        <div class="navbar-actions">
          <a
            href="https://github.com/H4DRI165/kasatria_assignment"
            target="_blank"
            rel="noopener noreferrer"
            class="github-link"
          >
            GitHub Repository
          </a>

          <button
            id="connect-sheets-button"
            class="connect-sheets-button"
            type="button"
          >
            Connect Google Sheet
          </button>

          <div id="sheets-status" class="sheets-status hidden">
            <span class="status-indicator"></span>
            <span>Google Sheets Connected</span>
          </div>

          <button id="sign-out-button" type="button">Sign Out</button>
        </div>
      </header>

      <!-- Main Visualization -->
      <main class="main-content">
        <div id="visualization" class="visualization-container"></div>

        <!-- Layout Controls -->
        <div class="layout-controls">
          <button class="layout-button active" data-layout="table">
            Table
          </button>

          <button class="layout-button" data-layout="sphere">Sphere</button>

          <button class="layout-button" data-layout="helix">Helix</button>

          <button class="layout-button" data-layout="grid">Grid</button>
        </div>
      </main>
    </section>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
