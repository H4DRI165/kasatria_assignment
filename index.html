<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kasatria Assignment - Interactive 3D Periodic Table"
    />

    <title>Kasatria Assignment</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/visualization.css" />
  </head>

  <body>
    <section id="login-screen" class="login-screen">
      <div class="login-card">
        <h1 class="login-title">Login to Kasatria Assignment</h1>

        <p class="login-description">
          Sign in with your Google account to continue.
        </p>

        <button id="google-sign-in" class="google-sign-in" type="button">
          <svg
            class="google-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 48 48"
            aria-hidden="true"
          >
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.99 46.98 31.8 46.98 24.55z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56l7.98-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>

          <span>Sign in with Google</span>
        </button>
      </div>
    </section>

    <!-- Visualization Screen -->
    <section id="visualization-screen" class="visualization-screen hidden">
      <!-- Top Navigation -->
      <header class="navbar">
        <div class="navbar-brand">
          <h2>Kasatria Assignment</h2>
        </div>

        <div class="navbar-actions">
          <a
            href="https://github.com/H4DRI165/kasatria_assignment"
            target="_blank"
            rel="noopener noreferrer"
            class="github-link"
          >
            GitHub Repository
          </a>

          <button id="sign-out-button" type="button">Sign Out</button>
        </div>
      </header>

      <!-- Main Visualization -->
      <main class="main-content">
        <div id="visualization" class="visualization-container"></div>

        <!-- Layout Controls -->
        <div class="layout-controls">
          <button class="layout-button active" data-layout="table">
            Table
          </button>

          <button class="layout-button" data-layout="sphere">Sphere</button>

          <button class="layout-button" data-layout="helix">Helix</button>

          <button class="layout-button" data-layout="grid">Grid</button>
        </div>
      </main>
    </section>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
